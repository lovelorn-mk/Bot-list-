<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBHD // FLIGHT TEST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #060606;
      color: #f2f2f2;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .sky-scene {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: linear-gradient(180deg, #050505 0%, #101010 68%, #181818 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .sky-scene.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: #999;
      text-transform: uppercase;
      z-index: 3;
    }

    .skip-btn {
      background: #0d0d0d;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .skip-btn:hover {
      background: #fff;
      color: #000;
    }

    .status-center {
      text-align: center;
      padding: 0 20px;
      z-index: 3;
    }

    .status-center h1 {
      font-family: 'Times New Roman', serif;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .status-center p {
      font-size: 11px;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
    }

    .flight-zone {
      position: relative;
      flex: 1;
      width: 100%;
      z-index: 2;
    }

    .plane {
      position: absolute;
      left: 0;
      top: 0;
      width: 120px;
      color: #fff;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
      will-change: transform;
      animation: glideDown 3.5s ease-in-out forwards;
    }

    @keyframes glideDown {
      0% {
        transform: translate(-15vw, 8vh) rotate(12deg) scale(0.85);
      }
      65% {
        transform: translate(52vw, 34vh) rotate(6deg) scale(1);
      }
      100% {
        transform: translate(76vw, 54vh) rotate(0deg) scale(0.9);
      }
    }

    .ground {
      height: 110px;
      background: #070707;
      border-top: 1px solid #262626;
      position: relative;
      z-index: 2;
    }

    .houses {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 20px;
    }

    .mini-house {
      width: 28px;
      height: 18px;
      border: 1px solid #444;
      border-bottom: none;
      position: relative;
      background: #0c0c0c;
    }

    .mini-house::before {
      content: "";
      position: absolute;
      top: -9px;
      left: 2px;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 9px solid #444;
    }

    .mini-house.flip {
      transform: rotate(180deg);
      border-color: #777;
    }

    .runway-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 28px;
      background: #0b0b0b;
      border-top: 1px solid #303030;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }

    .dash {
      width: 24px;
      height: 2px;
      background: #555;
    }

    .page-content {
      padding: 48px 24px;
      max-width: 820px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="sky-scene" id="skyScene">
    <div class="top-bar">
      <span>THE NBHD // FLIGHT 01</span>
      <span id="phaseLabel">IN FLIGHT</span>
      <button type="button" class="skip-btn" id="skipBtn">SKIP →</button>
    </div>

    <div class="status-center">
      <h1 id="headline">Flying into The Neighbourhood...</h1>
      <p id="subline">Preparing for landing</p>
    </div>

    <div class="flight-zone">
      <div class="plane" id="plane">
        <svg viewBox="0 0 160 64" fill="currentColor" aria-hidden="true">
          <path d="M148 31c-6-3-18-5-33-6L76 8H62l15 17H42L24 14H14l9 15-9 15h10l18-11h35L62 56h14l39-17c15-1 27-3 33-6 4-1 6-2 6-2s-2-1-6-2z"/>
        </svg>
      </div>
    </div>

    <div class="ground">
      <div class="houses" aria-hidden="true">
        <div class="mini-house"></div>
        <div class="mini-house flip"></div>
        <div class="mini-house"></div>
        <div class="mini-house flip"></div>
        <div class="mini-house"></div>
        <div class="mini-house flip"></div>
        <div class="mini-house"></div>
      </div>
      <div class="runway-strip" aria-hidden="true">
        <span class="dash"></span>
        <span class="dash"></span>
        <span class="dash"></span>
        <span class="dash"></span>
        <span class="dash"></span>
        <span class="dash"></span>
      </div>
    </div>
  </div>

  <main class="page-content">
    <h2>LANDED IN THE NEIGHBOURHOOD</h2>
    <p style="color:#888; margin-top:8px;">Your bot directory content goes here.</p>
    <button type="button" class="skip-btn" id="replayBtn" style="margin-top:16px;">REPLAY FLIGHT</button>
  </main>

  <script>
    const skyScene = document.getElementById('skyScene');
    const plane = document.getElementById('plane');
    const phaseLabel = document.getElementById('phaseLabel');
    const headline = document.getElementById('headline');
    const subline = document.getElementById('subline');
    const skipBtn = document.getElementById('skipBtn');
    const replayBtn = document.getElementById('replayBtn');

    let timers = [];

    function clearTimers() {
      timers.forEach(t => clearTimeout(t));
      timers = [];
    }

    function hideScene() {
      clearTimers();
      skyScene.classList.add('done');
    }

    function playFlight() {
      clearTimers();
      skyScene.classList.remove('done');
      phaseLabel.textContent = 'IN FLIGHT';
      headline.textContent = 'Flying into The Neighbourhood...';
      subline.textContent = 'Preparing for landing';

      plane.style.animation = 'none';
      void plane.offsetWidth;
      plane.style.animation = 'glideDown 3.5s ease-in-out forwards';

      timers.push(setTimeout(() => {
        phaseLabel.textContent = 'LANDING';
        headline.textContent = 'Touching down on the street...';
        subline.textContent = 'Welcome in';
      }, 2200));

      timers.push(setTimeout(hideScene, 3900));
    }

    skipBtn.addEventListener('click', hideScene);
    replayBtn.addEventListener('click', playFlight);

    playFlight();
  </script>
</body>
</html>
